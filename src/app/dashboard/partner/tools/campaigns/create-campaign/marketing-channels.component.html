<section class="breadcrumb-wrapper">
  <div class="breadcrumb">
    <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="scrollToTop()">Dashboard</a> &gt;
    <a>Tools</a> &gt;
    <a>Campaigns</a> &gt;
    <span>Create campaign</span>
  </div>
</section>

<section class="async-background ">
  <div class="page-head">
    <h2>Start a campaign <mat-icon (click)="showDescription()">help</mat-icon></h2>
  </div>
  <p class="subtitle">Choose a channel to promote your business — visits and recruits flow back into earnings.</p>

  <section class="async-container">

    <mat-tab-group>

      <mat-tab label="Facebook">
        @if (partner) {
          <async-facebook [partner]="partner"/>
        }
      </mat-tab>

      <mat-tab label="Youtube">
        @if (partner) {
          <async-youtube [partner]="partner"/>
        }
      </mat-tab>

      <mat-tab label="LinkedIn">
        @if (partner) {
          <async-linkedin [partner]="partner"/>
        }
      </mat-tab>

      <!-- <mat-tab label="Google (Search Engine)">
      <async-google *ngIf="partner" [partner]="partner"></async-google>
    </mat-tab> -->

    <!-- <mat-tab label="Email"> Content 3 </mat-tab> -->
  </mat-tab-group>

</section>

</section>
